name = "betonteplice-api"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"

# Enable Node.js compatibility mode
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.

# For secrets like GOOGLE_PRIVATE_KEY, use:
# wrangler secret put NEON_DB_URL
# wrangler secret put GOOGLE_CLIENT_EMAIL
# wrangler secret put GOOGLE_PRIVATE_KEY
# wrangler secret put GOOGLE_CALENDAR_ID
# wrangler secret put VITE_ADMIN_EMAIL
# wrangler secret put VITE_ADMIN_PASSWORD
# wrangler secret put ADMIN_EMAIL
# wrangler secret put GMAIL_USER
# wrangler secret put GMAIL_APP_PASSWORD
# wrangler secret put ALLOWED_ORIGIN
# wrangler secret put GMAIL_CLIENT_ID
# wrangler secret put GMAIL_CLIENT_SECRET
# wrangler secret put GMAIL_REFRESH_TOKEN
# wrangler secret put JWT_SECRET
# wrangler secret put VITE_ARES_URL


[build]
command = "bun run build:worker"

# You'll need to add these secrets via the Cloudflare dashboard or CLI
# - NEON_DB_URL
# - GOOGLE_CLIENT_EMAIL
# - GOOGLE_PRIVATE_KEY
# - GOOGLE_CALENDAR_ID
# - VITE_ADMIN_EMAIL
# - VITE_ADMIN_PASSWORD
# - ADMIN_EMAIL
# - GMAIL_USER
# - GMAIL_APP_PASSWORD 
# - ALLOWED_ORIGIN
# - GMAIL_CLIENT_ID
# - GMAIL_CLIENT_SECRET
# - GMAIL_REFRESH_TOKEN
# - JWT_SECRET
# - VITE_ARES_URL