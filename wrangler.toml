name = "betonteplice-api"
main = "worker/src/index.ts"
compatibility_date = "2024-02-11"

# Enable Node.js compatibility mode
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.

# Define environment variable types
[vars]
GOOGLE_CLIENT_EMAIL = ""
GOOGLE_CALENDAR_ID = ""
NEON_DB_URL = ""
ADMIN_EMAIL = ""
ALLOWED_ORIGIN = "https://betonteplice.cz"

# For secrets like GOOGLE_PRIVATE_KEY, use:
# wrangler secret put GOOGLE_PRIVATE_KEY

[build]
command = "bun run build:worker"

# You'll need to add these secrets via the Cloudflare dashboard or CLI
# - NEON_DB_URL
# - GOOGLE_CLIENT_EMAIL
# - GOOGLE_PRIVATE_KEY
# - GOOGLE_CALENDAR_ID
# - VITE_ADMIN_EMAIL
# - VITE_ADMIN_PASSWORD
# - ADMIN_EMAIL
# - GMAIL_USER
# - GMAIL_APP_PASSWORD 